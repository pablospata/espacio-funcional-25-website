# Vista previa en GitHub Pages: publica solo los archivos del sitio (docs/ y README.md quedan afuera).
# El sitio definitivo va en Hostinger, donde .htaccess bloquea docs/.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio sin docs/
        run: |
          mkdir _site
          cp -r index.html favicon.ico robots.txt sitemap.xml css js assets _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
